<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fysiikan ilmiölaboratorio</title>
    <link rel="stylesheet" href="./src/styles/tokens.css">
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
    <link rel="stylesheet" href="./src/styles/topic-nav.css">
    <link rel="stylesheet" href="./src/styles/controls.css">
    <link rel="stylesheet" href="./src/styles/lesson.css">
    <link rel="stylesheet" href="./src/styles/buttons.css">
  </head>
  <body>
    <main class="page-shell">
      <div class="app-grid">

        <header class="panel hero">
          <div>
            <p class="eyebrow">FY3 / FY7</p>
            <h1>Fysiikan ilmiölaboratorio</h1>
            <p>Tutki aaltoja, ääntä, säteilyä, valoa, peilejä ja linssejä visuaalisesti.</p>
          </div>
          <div class="hero-tools">
            <div class="hero-actions">
              <button class="secondary-button" id="toggle-motion">Pysäytä</button>
              <button class="secondary-button" id="reset-app">Palauta alkuasetukset</button>
            </div>
          </div>
        </header>

        <nav class="panel topic-nav">
          <div class="topic-buttons" id="topic-buttons"></div>
        </nav>

        <section class="panel topic-intro-panel">
          <h2 id="topic-title"></h2>
          <p id="topic-intro"></p>
          <div class="concepts-grid" id="concepts-grid"></div>
        </section>

        <section class="panel visual-panel">
          <div class="visual-topline">
            <div class="visual-copy">
              <h2 id="canvas-title"></h2>
              <p id="canvas-copy"></p>
            </div>
          </div>
          <div class="canvas-shell">
            <canvas id="wave-canvas" aria-label="Fysiikan simulaattorin animaatio"></canvas>
          </div>
        </section>

        <section class="panel controls-panel">
          <h2>Säätimet</h2>
          <div class="control-grid" id="control-grid"></div>
          <div class="derived-strip" id="derived-strip"></div>
        </section>

        <section class="panel lesson-panel">
          <div class="lesson-topline">
            <div>
              <h2 id="lesson-title">Harjoitustehtävä</h2>
            </div>
            <span class="progress-text" id="lesson-progress"></span>
          </div>
          <div class="lesson-copy" id="lesson-copy" aria-live="polite"></div>
        </section>

      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
